[general]
default_user    = cpndev01
status_script   = app_status.sh
start_script    = app_start.sh
stop_script     = app_stop.sh

# ── Vault ─────────────────────────────────────────────────────────────────────
# All secrets (API client IDs, client secrets, URLs) are fetched from Vault at
# runtime.  Nothing sensitive lives in this file except the AppRole credentials.
[vault]
url             = https://vault-non-prod.cloud.socgen
namespace       = myVault/CPN_196606_DEV_mercury_nonprod
auth_method     = approle
role_id         = FILL_IN_ROLE_ID_HERE
secret_id       = FILL_IN_SECRET_ID_HERE
kv_version      = 1
kv_backend      = kv
verify_ssl      = true
; set verify_ssl = false only if you hit SSL errors on the corporate network

# ── Alias → canonical service name ───────────────────────────────────────────
# Add as many short forms as you want here; no code changes needed.
[service_aliases]
eai              = EAI
cans             = cans
can              = cans
rmq              = rmq-producer
rmqp             = rmq-producer
rmq_p            = rmq_producer
rmq_prod         = rmq_producer
wmq              = wmq-file-integrator
wmq_file         = wmq-file-integrator
wmqfile          = wmq-file-integrator
integrator       = wmq-file-integrator
file_integrator  = wmq-file-integrator
si               = si
batch            = batch
nap              = batch

# ── Servers ───────────────────────────────────────────────────────────────────
# aliases: first alias = display label shown in output
# services: comma-separated list of services on this server
# To add a new server just add a new [server:XXX] block — no code changes needed.

[server:030]
host             = cpnuatap030
user             = cpndev01
scripts_dir      = /home/cpndev01/scripts
services         = EAI,cans,rmq-producer,wmq-file-integrator,si,batch
aliases          = uat,030,uatap030,cpnuatap030,juat
vault_secret_path = kv/eai-juat
host.si          = cpnuatap028
status_script.si = bancs_si_status.sh
host.batch       = ip-192-175-131-238.compute.eu-fr-paris.cloud.socgen
